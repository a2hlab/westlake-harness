{
  "comment": [
    "New separately authorized recovery; old stop/data preserved; no unsafe overlay."
  ],
  "jobs": [
    {
      "name": "param:westlake-u13-toutiao-overlay-start",
      "condition": "sys.westlake.demo.u13.ready=true",
      "cmds": [
        "start westlake-u13-toutiao-overlay"
      ]
    }
  ],
  "services": [
    {
      "name": "westlake-u13-toutiao-overlay",
      "path": [
        "/system/bin/sh",
        "/data/westlake-demo/toutiao/recovery-attempts/icon-manual-20261021-r4c/boot-entry.sh"
      ],
      "uid": "root",
      "gid": [
        "root",
        "system"
      ],
      "setuid": true,
      "start-mode": "condition",
      "once": 1,
      "sandbox": 0,
      "secon": "u:r:su:s0",
      "apl": "normal",
      "permission": [
        "ohos.permission.DUMP",
        "ohos.permission.CAPTURE_SCREEN"
      ],
      "permission_acls": [
        "ohos.permission.DUMP",
        "ohos.permission.CAPTURE_SCREEN"
      ]
    }
  ]
}
