schema_version: "1.0"
kind: FN_OS_OBJECT_PRESENTATION_PROJECTION
authority: PRESENTATION_ONLY
disclaimer: >-
  本文件只定义可视化分组和对象标签。Concept、关系、路线裁决与成熟度仍以
  docs/spec/concepts.yaml、docs/spec/concept-graph.yaml、各 Fn Concept 文档和独立证据为准。

columns:
  - id: identity
    name: 身份边界
    question: 谁拥有身份与隔离范围？
  - id: definition
    name: 定义 / 安装
    question: 静态定义和持久记录是什么？
  - id: runtime
    name: 运行宿主
    question: 哪个实例真正执行？
  - id: orchestration
    name: 调度 / 任务
    question: 谁决定顺序、前后台和生命周期？
  - id: interaction
    name: 交互对象
    question: 调用者实际操作什么？
  - id: display
    name: 显示 / 资源
    question: 什么最终进入界面或宿主能力？
  - id: evidence
    name: 回执 / 证据
    question: 如何证明成功或失败？

concepts:
  Fn01:
    story: 从 APK 输入到可查询、可启动、可回滚的持久包事实。
    lanes:
      android:
        - {column: definition, title: "APK / AndroidManifest", note: "安装输入与组件声明", source: "docs/concepts/Fn01/ANDROID_MODEL.md"}
        - {column: definition, title: "PackageSetting / PackageInfo", note: "包真相与查询视图", source: "docs/concepts/Fn01/C02/README.md"}
        - {column: interaction, title: "ApplicationInfo / Component", note: "调用者可见的包与组件对象", source: "docs/concepts/Fn01/C03/README.md"}
        - {column: display, title: "Resource / Signature", note: "资源投影和签名事实", source: "docs/concepts/Fn01/C05/README.md"}
      bridge:
        - {column: definition, title: "Package projection", note: "Android 包事实到宿主记录的投影", source: "docs/concepts/Fn01/BRIDGE_CONTRACT.md"}
        - {column: orchestration, title: "MultiPackageJob", note: "可恢复的多包提交与回滚单元", source: "docs/concepts/Fn01/C07/README.md"}
        - {column: evidence, title: "Install ledger / receipt", note: "逐包终态、查询与恢复回执", source: "docs/concepts/Fn01/BRIDGE_CONTRACT.md"}
      openharmony:
        - {column: definition, title: "Bundle / BundleInfo", note: "BMS 原生包记录和查询对象", source: "docs/concepts/Fn01/OPENHARMONY_MODEL.md"}
        - {column: orchestration, title: "BundleInstaller / BundleDataMgr", note: "宿主安装事务和持久化 owner", source: "docs/concepts/Fn01/OPENHARMONY_MODEL.md"}
        - {column: display, title: "Bundle resource projection", note: "Launcher 可见图标与标签", source: "docs/concepts/Fn01/OPENHARMONY_MODEL.md"}
        - {column: evidence, title: "BMS commit result", note: "安装、更新、卸载与查询终态", source: "docs/concepts/Fn01/OPENHARMONY_MODEL.md"}

  Fn02:
    story: 从宿主进程创建到 ART、JNI 和 native ABI 可执行环境就绪。
    lanes:
      android:
        - {column: identity, title: "Process identity", note: "uid、pid、processName 与 generation", source: "docs/concepts/Fn02/ANDROID_MODEL.md"}
        - {column: runtime, title: "Process / ART Runtime", note: "Android 应用代码的真实执行实例", source: "docs/concepts/Fn02/C01/README.md"}
        - {column: runtime, title: "BootClassPath / JNI", note: "framework 类与 native 注册入口", source: "docs/concepts/Fn02/C03/README.md"}
        - {column: interaction, title: "NativeLibrary / Bionic ABI", note: "APK native 库与 libc 假设", source: "docs/concepts/Fn02/C04/README.md"}
      bridge:
        - {column: runtime, title: "Runtime bootstrap", note: "预载、fork 后初始化与应用绑定", source: "docs/concepts/Fn02/BRIDGE_CONTRACT.md"}
        - {column: runtime, title: "AdapterRegistry / NativeShim", note: "JNI 与 NDK API 的边界翻译", source: "docs/concepts/Fn02/C06/README.md"}
        - {column: identity, title: "Linker / ABI isolation", note: "musl 与 Bionic 冲突隔离", source: "docs/concepts/Fn02/C05/README.md"}
        - {column: evidence, title: "Runtime-ready receipt", note: "同代进程、VM、JNI 和库加载终态", source: "docs/concepts/Fn02/BRIDGE_CONTRACT.md"}
      openharmony:
        - {column: runtime, title: "appspawn child", note: "宿主负责创建与特化的进程", source: "docs/concepts/Fn02/OPENHARMONY_MODEL.md"}
        - {column: identity, title: "Process specialization", note: "uid/gid、token、namespace 与 sandbox", source: "docs/concepts/Fn02/OPENHARMONY_MODEL.md"}
        - {column: runtime, title: "musl / native loader", note: "宿主 native 运行基础", source: "docs/concepts/Fn02/OPENHARMONY_MODEL.md"}
        - {column: evidence, title: "Spawn / load result", note: "进程创建、退出与加载失败事实", source: "docs/concepts/Fn02/OPENHARMONY_MODEL.md"}

  Fn03:
    story: 让真实 Activity 实例在两套生命周期 owner 之间保持同代、有序和可证明。
    lanes:
      android:
        - {column: definition, title: "Activity class", note: "Manifest 中声明的组件定义", source: "docs/concepts/Fn03/ANDROID_MODEL.md"}
        - {column: runtime, title: "Activity instance", note: "运行在 ActivityThread 中的真实实例", source: "docs/concepts/Fn03/C01/README.md"}
        - {column: orchestration, title: "ClientTransaction / ActivityState", note: "create 到 destroy 的状态转换", source: "docs/concepts/Fn03/C02/README.md"}
        - {column: identity, title: "Activity token", note: "实例与调度命令的稳定身份", source: "docs/concepts/Fn03/C03/README.md"}
      bridge:
        - {column: identity, title: "ActivityToken map", note: "Android token ↔ OH remote token", source: "docs/concepts/Fn03/BRIDGE_CONTRACT.md"}
        - {column: orchestration, title: "Lifecycle translator", note: "保持 owner、顺序和 generation", source: "docs/concepts/Fn03/BRIDGE_CONTRACT.md"}
        - {column: evidence, title: "Lifecycle receipt", note: "callback、host 与终态回执 join", source: "docs/concepts/Fn03/BRIDGE_CONTRACT.md"}
      openharmony:
        - {column: runtime, title: "UIAbility instance", note: "宿主前台组件实例", source: "docs/concepts/Fn03/OPENHARMONY_MODEL.md"}
        - {column: orchestration, title: "AbilityRecord / lifecycle", note: "OH lifecycle owner 与调度记录", source: "docs/concepts/Fn03/OPENHARMONY_MODEL.md"}
        - {column: identity, title: "IRemoteObject token", note: "宿主 Ability 身份", source: "docs/concepts/Fn03/OPENHARMONY_MODEL.md"}
        - {column: evidence, title: "Ability transition result", note: "宿主状态与失败回执", source: "docs/concepts/Fn03/OPENHARMONY_MODEL.md"}

  Fn04:
    story: 从窗口身份到 buffer、transaction 和真正可观察的首帧呈现。
    lanes:
      android:
        - {column: identity, title: "Window token / WindowState", note: "窗口 owner 与 generation", source: "docs/concepts/Fn04/ANDROID_MODEL.md"}
        - {column: display, title: "Surface / BufferQueue", note: "图形生产者与 buffer 生命周期", source: "docs/concepts/Fn04/C02/README.md"}
        - {column: display, title: "SurfaceControl / Transaction", note: "图层属性与提交", source: "docs/concepts/Fn04/C04/README.md"}
        - {column: evidence, title: "RenderFrame / present", note: "一帧的提交与显示终态", source: "docs/concepts/Fn04/C05/README.md"}
      bridge:
