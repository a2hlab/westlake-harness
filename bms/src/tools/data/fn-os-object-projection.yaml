        - {column: interaction, title: "IRemoteObject / connection", note: "宿主连接与远程端点", source: "docs/concepts/Fn07/OPENHARMONY_MODEL.md"}
        - {column: evidence, title: "Connect / disconnect result", note: "宿主回调和死亡事实", source: "docs/concepts/Fn07/OPENHARMONY_MODEL.md"}

  Fn08:
    story: 把 package、user、uid、签名、权限与宿主 token/sandbox 组成可撤销身份链。
    lanes:
      android:
        - {column: identity, title: "UserHandle / userId", note: "用户隔离域", source: "docs/concepts/Fn08/ANDROID_MODEL.md"}
        - {column: identity, title: "UID / appId / PID", note: "调用者与进程身份", source: "docs/concepts/Fn08/ANDROID_MODEL.md"}
