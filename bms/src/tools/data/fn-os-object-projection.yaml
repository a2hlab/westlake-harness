        - {column: evidence, title: "Rows / changes / fd result", note: "宿主连接和结果事实", source: "docs/concepts/Fn09/OPENHARMONY_MODEL.md"}

  Fn10:
    story: 让 HWUI、Skia 和 Graphics JNI 产生可提交、可同步、可证明的宿主图形工作。
