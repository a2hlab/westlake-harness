        - {column: display, title: "BufferQueueSurface / NativeWindow", note: "OH Surface 的 Android 兼容包装", source: "docs/concepts/Fn04/C03/README.md"}
        - {column: display, title: "SurfaceControl mapping", note: "transaction 到 RSNode 的边界翻译", source: "docs/concepts/Fn04/BRIDGE_CONTRACT.md"}
        - {column: evidence, title: "Frame receipt join", note: "submit、finish 与 content-present 联合终态", source: "docs/concepts/Fn04/BRIDGE_CONTRACT.md"}
      openharmony:
        - {column: identity, title: "SceneSession / hostSession", note: "宿主窗口记录与 persistent id", source: "docs/concepts/Fn04/OPENHARMONY_MODEL.md"}
        - {column: display, title: "ProducerSurface / SurfaceBuffer", note: "宿主 buffer 生产与 flush", source: "docs/concepts/Fn04/OPENHARMONY_MODEL.md"}
        - {column: display, title: "RSNode / RSTransaction", note: "RenderService 图层与提交", source: "docs/concepts/Fn04/OPENHARMONY_MODEL.md"}
        - {column: evidence, title: "RS commit / present fact", note: "宿主提交与可观察显示事实", source: "docs/concepts/Fn04/OPENHARMONY_MODEL.md"}

  Fn05:
    story: 把宿主输入转换为带窗口身份、焦点世代和完成回执的 Android InputEvent。
