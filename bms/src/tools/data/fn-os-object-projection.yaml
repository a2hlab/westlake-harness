        - {column: interaction, title: "InputEvent", note: "Pointer、Key、Joystick 等类型化事件", source: "docs/concepts/Fn05/C02/README.md"}
        - {column: identity, title: "InputFocus", note: "焦点窗口与 epoch", source: "docs/concepts/Fn05/C03/README.md"}
        - {column: evidence, title: "FINISHED / handled", note: "事件完成和消费结果", source: "docs/concepts/Fn05/ANDROID_MODEL.md"}
