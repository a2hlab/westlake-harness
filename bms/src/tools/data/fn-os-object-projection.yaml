        - {column: orchestration, title: "Mission / SceneBoard", note: "宿主任务与前后台投影", source: "docs/concepts/Fn06/OPENHARMONY_MODEL.md"}
        - {column: orchestration, title: "AppScheduler callback", note: "ScheduleLaunchAbility 等宿主入口", source: "docs/concepts/Fn06/OPENHARMONY_MODEL.md"}
        - {column: evidence, title: "Ability start result", note: "宿主启动、恢复与错误事实", source: "docs/concepts/Fn06/OPENHARMONY_MODEL.md"}

  Fn07:
    story: 保持 Android Service 的启动、绑定、发布、死亡和销毁语义。
    lanes:
      android:
        - {column: definition, title: "Service component", note: "Manifest 服务定义与解析目标", source: "docs/concepts/Fn07/ANDROID_MODEL.md"}
        - {column: runtime, title: "Service instance", note: "真实 Android Service 与生命周期", source: "docs/concepts/Fn07/C01/README.md"}
