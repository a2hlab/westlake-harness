        - {column: evidence, title: "Input receipt", note: "转换、投递、FINISHED 或 typed failure", source: "docs/concepts/Fn05/BRIDGE_CONTRACT.md"}
      openharmony:
        - {column: interaction, title: "MMI Pointer / Key event", note: "宿主原始输入对象", source: "docs/concepts/Fn05/OPENHARMONY_MODEL.md"}
        - {column: identity, title: "WMS focus / target", note: "宿主焦点与命中窗口", source: "docs/concepts/Fn05/OPENHARMONY_MODEL.md"}
        - {column: interaction, title: "InputMethod framework", note: "宿主输入法服务能力", source: "docs/concepts/Fn05/OPENHARMONY_MODEL.md"}
        - {column: evidence, title: "MMI callback result", note: "宿主投递与错误事实", source: "docs/concepts/Fn05/OPENHARMONY_MODEL.md"}

  Fn06:
    story: Intent 解析为目标组件，并在 Android Task 与 OH Mission 之间保持任务语义。
    lanes:
      android:
        - {column: interaction, title: "Intent", note: "action、data、component、flags 与 extras", source: "docs/concepts/Fn06/C01/README.md"}
