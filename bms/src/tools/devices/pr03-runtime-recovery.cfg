{
    "jobs" : [{
            "name" : "param:pr03-runtime-recover-start",
            "condition" : "bootevent.boot.completed=true",
            "cmds" : [
                "start pr03-runtime-recover"
            ]
        }
    ],
    "services" : [{
            "name" : "pr03-runtime-recover",
            "path" : ["/system/bin/sh", "/system/etc/pr03-runtime-recover.sh"],
            "uid" : "root",
            "gid" : ["root", "system"],
            "caps" : ["DAC_OVERRIDE", "CHOWN", "FOWNER", "SYS_ADMIN"],
            "start-mode" : "condition",
            "once" : 1,
            "sandbox" : 0,
            "secon" : "u:r:su:s0"
        }
    ]
}
